<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{business_name}}</title>
  <style>
    body{margin:0;font-family:system-ui,Segoe UI,Roboto;background:#fff;color:#111}
    .wrap{max-width:1100px;margin:0 auto;padding:28px}
    .hero{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;align-items:center}
    @media(max-width:900px){.hero{grid-template-columns:1fr}}
    .card{background:#f3f4f6;border-radius:18px;padding:18px}
    .btn{display:inline-block;background:#0ea5e9;color:#fff;padding:12px 16px;border-radius:14px;text-decoration:none;font-weight:700}
    img{width:100%;border-radius:16px;display:block}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    @media(max-width:900px){.grid{grid-template-columns:1fr}}
    .muted{color:#6b7280}
    ul{margin:0;padding-left:18px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div>
        <h1 style="margin:0 0 10px;font-size:42px;line-height:1.1">{{business_name}}</h1>
        <div class="muted">{{industry}}</div>

        <div style="height:10px"></div>
        <div class="card">
          <div style="font-weight:700;margin-bottom:6px">Palvelut</div>
          {{services_html}}
        </div>

        <div style="height:14px"></div>
        <a class="btn" href="mailto:{{email}}">Pyydä tarjous</a>

        <div class="muted" style="margin-top:10px">
          {{phone}} · {{email}} · {{city}}
        </div>
      </div>

      <div>
        <img src="{{hero_image_url}}" alt="" />
      </div>
    </div>

    <div style="height:18px"></div>
    <div class="grid">
      {{gallery_html}}
    </div>

    <div style="height:18px"></div>
    <div class="card">
      <div style="font-weight:700">Yhteystiedot</div>
      <div class="muted">{{address}}</div>
    </div>
  </div>
</body>
</html>
