<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yritys | Palvelut</title>
  <meta name="description" content="Yritys – Palvelut. Ota yhteyttä ja pyydä tarjous.">
  <style>
    :root{--bg:#0B1220;--panel:rgba(255,255,255,.05);--text:#eaf0ff;--muted:rgba(234,240,255,.7);--accent:#22c55e;--border:rgba(255,255,255,.10);--r:22px;}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,Arial; background:radial-gradient(1200px 600px at 20% 10%, rgba(34,197,94,.18), transparent 55%), radial-gradient(900px 500px at 80% 20%, rgba(59,130,246,.20), transparent 55%), var(--bg); color:var(--text);}
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}
    .wrap{max-width:1100px;margin:0 auto;padding:26px}
    .top{display:flex;gap:18px;align-items:center;justify-content:space-between;margin-bottom:18px}
    .badge{display:inline-flex;gap:8px;align-items:center;padding:8px 12px;border:1px solid var(--border);border-radius:999px;background:rgba(0,0,0,.18);font-size:13px;color:var(--muted)}
    .hero{display:grid;grid-template-columns:1.4fr .6fr;gap:18px;align-items:stretch}
    .panel{border:1px solid var(--border);border-radius:var(--r);background:var(--panel);backdrop-filter: blur(10px);padding:20px}
    .h1{font-size:46px;letter-spacing:-.02em;margin:0}
    .sub{margin:10px 0 0;color:var(--muted);font-size:18px}
    .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 16px;border-radius:999px;border:1px solid var(--border);background:rgba(0,0,0,.18);color:var(--text);font-weight:600}
    .btn.primary{background:var(--accent);border-color:transparent;color:#062312}
    .heroCard{overflow:hidden;padding:0}
    img{display:block;width:100%;height:100%;object-fit:cover}
    h2{margin:0 0 10px;font-size:20px}
    .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
    .muted{color:var(--muted)}
    .list{margin:0;padding-left:18px;color:var(--muted)}
    .contact{display:grid;gap:10px}
    .label{font-size:12px;color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
    .card{border:1px solid var(--border);border-radius:18px;overflow:hidden;background:rgba(0,0,0,.20)}
    footer{margin-top:26px;padding-top:18px;border-top:1px solid var(--border);color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
    @media (max-width: 900px){.hero{grid-template-columns:1fr}.h1{font-size:36px}.cols{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="badge">FIN15</div>
      <div class="badge">Automaattisesti luotu FIN15-landing-sivu</div>
    </div>

    <section class="hero">
      <div class="panel">
        <div class="badge" style="margin-bottom:10px">Palvelut</div>
        <h1 class="h1">Yritys</h1>
        <p class="sub">Palvelut</p>

        <div class="cta">
          
          
          
        </div>
      </div>

      <div class="card heroCard"><img src="https://images.pexels.com/photos/4239007/pexels-photo-4239007.jpeg?auto=compress&amp;cs=tinysrgb&amp;h=650&amp;w=940" alt="Yritys hero-kuva" loading="lazy" /></div>
    </section>

    <section class="cols">
      <div class="panel">
        <h2>Palvelumme</h2>
        <p class="muted">Lisää palvelut lomakkeella.</p>
      </div>

      <div class="panel">
        <h2>Yhteystiedot</h2>
        <div class="contact"><div class="muted">Lisää yhteystiedot lomakkeelta.</div></div>
      </div>
    </section>

    
    <section class="panel">
      <h2>Kuvia</h2>
      <div class="grid">
        
          <figure class="card">
            <img src="https://images.pexels.com/photos/4239007/pexels-photo-4239007.jpeg?auto=compress&amp;cs=tinysrgb&amp;h=650&amp;w=940" alt="Yritys – kuva 1" loading="lazy" />
          </figure>
        
          <figure class="card">
            <img src="https://images.pexels.com/photos/35147161/pexels-photo-35147161.jpeg?auto=compress&amp;cs=tinysrgb&amp;h=650&amp;w=940" alt="Yritys – kuva 2" loading="lazy" />
          </figure>
        
          <figure class="card">
            <img src="https://images.pexels.com/photos/31328717/pexels-photo-31328717.jpeg?auto=compress&amp;cs=tinysrgb&amp;h=650&amp;w=940" alt="Yritys – kuva 3" loading="lazy" />
          </figure>
        
          <figure class="card">
            <img src="https://images.pexels.com/photos/35147280/pexels-photo-35147280.jpeg?auto=compress&amp;cs=tinysrgb&amp;h=650&amp;w=940" alt="Yritys – kuva 4" loading="lazy" />
          </figure>
        
      </div>
    </section>
  

    <footer>
      <div>© 2026 Yritys</div>
      <div class="muted">Luotu automaattisesti – n8n • OpenAI • GitHub • Netlify</div>
    </footer>
  </div>
</body>
</html>
