<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yritys | Palvelut</title>
  <meta name="description" content="Yritys – Palvelut. Ota yhteyttä ja pyydä tarjous.">
  <style>
    :root{
      --bg:#0B1220;
      --panel:#0f172a;
      --text:#fff;
      --muted:#cbd5e1;
      --accent:#22c55e;
      --border:rgba(255,255,255,.08);
      --shadow: 0 12px 30px rgba(0,0,0,.35);
      --radius: 18px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu;color:var(--text);background:var(--bg);line-height:1.5}
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}
    .wrap{max-width:1100px;margin:0 auto;padding:24px}
    .hero{border-bottom:1px solid var(--border);background-size:cover;background-position:center;padding:72px 0}
    .heroInner{max-width:1100px;margin:0 auto;padding:0 24px;display:flex;gap:24px;align-items:flex-end;justify-content:space-between}
    .hero h1{margin:0;font-size:42px;letter-spacing:-.02em}
    .hero p{margin:10px 0 0;color:var(--muted);font-size:18px}
    .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 16px;border-radius:999px;border:1px solid var(--border);background:rgba(15,23,42,.7);color:var(--text);box-shadow:var(--shadow)}
    .btnPrimary{background:var(--accent);color:#071b0d;border-color:transparent;font-weight:700}
    .main{padding:28px 0}
    .panel{background:rgba(15,23,42,.85);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
    .section{margin-top:22px}
    h2{margin:0 0 12px;font-size:22px}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .card{border:1px solid var(--border);border-radius:16px;overflow:hidden;background:#0b1220}
    img{width:100%;height:200px;object-fit:cover;display:block}
    .cols{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;align-items:start}
    .muted{color:var(--muted)}
    footer{padding:26px 0;color:var(--muted);border-top:1px solid var(--border)}
    @media (max-width: 900px){
      .hero h1{font-size:34px}
      .cols{grid-template-columns:1fr}
      .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      img{height:160px}
      .heroInner{flex-direction:column;align-items:flex-start}
    }
  </style>
</head>
<body>

  <header class="hero" style="background-image: linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.55)), url('https://images.pexels.com/photos/4239007/pexels-photo-4239007.jpeg?auto=compress&cs=tinysrgb&h=650&w=940');">
    <div class="heroInner">
      <div>
        <h1>Yritys</h1>
        <p>Palvelut</p>

        <div class="cta">
          
          
        </div>
      </div>

      <div class="panel" style="max-width:360px">
        <h2 style="margin:0 0 8px">Yhteystiedot</h2>
        <div class="muted">
          <p class="muted">Lisää yhteystiedot lomakkeelta.</p>
        </div>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="wrap">
      <div class="cols">
        <section class="panel">
          <h2>Palvelumme</h2>
          <p class="muted">
            Yritys tarjoaa palvelut-palveluita.
            Ota yhteyttä ja kerro tarpeesi – palaamme nopeasti.
          </p>
        </section>

        <aside class="panel">
          <h2>Ota yhteyttä</h2>
          <p class="muted">Lähetä viesti – vastaamme mahdollisimman pian.</p>
          
          
        </aside>
      </div>

      
  <section class="section">
    <h2>Kuvia</h2>
    <div class="grid">
      
        <figure class="card">
          <img src="https://images.pexels.com/photos/4239007/pexels-photo-4239007.jpeg?auto=compress&amp;cs=tinysrgb&amp;h=650&amp;w=940" alt="Yritys – kuva 1" loading="lazy" />
        </figure>

        <figure class="card">
          <img src="https://images.pexels.com/photos/35147161/pexels-photo-35147161.jpeg?auto=compress&amp;cs=tinysrgb&amp;h=650&amp;w=940" alt="Yritys – kuva 2" loading="lazy" />
        </figure>

        <figure class="card">
          <img src="https://images.pexels.com/photos/31328717/pexels-photo-31328717.jpeg?auto=compress&amp;cs=tinysrgb&amp;h=650&amp;w=940" alt="Yritys – kuva 3" loading="lazy" />
        </figure>

        <figure class="card">
          <img src="https://images.pexels.com/photos/35147280/pexels-photo-35147280.jpeg?auto=compress&amp;cs=tinysrgb&amp;h=650&amp;w=940" alt="Yritys – kuva 4" loading="lazy" />
        </figure>
    </div>
  </section>

    </div>
  </main>

  <footer>
    <div class="wrap">
      <div>© 2026 Yritys • Palvelut</div>
    </div>
  </footer>

</body>
</html>
