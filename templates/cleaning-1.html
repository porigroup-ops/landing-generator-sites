<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{business_name}}</title>
  <style>
    body{margin:0;font-family:system-ui,Segoe UI,Roboto;background:#f8fafc;color:#0f172a}
    .wrap{max-width:1100px;margin:0 auto;padding:28px}
    .top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .badge{background:#e0f2fe;color:#075985;padding:6px 10px;border-radius:999px;font-weight:700}
    .hero{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
    @media(max-width:900px){.hero{grid-template-columns:1fr}}
    .card{background:#ffffff;border:1px solid #e2e8f0;border-radius:18px;padding:18px}
    .btn{display:inline-block;background:#0284c7;color:#fff;padding:12px 16px;border-radius:14px;text-decoration:none;font-weight:800}
    img{width:100%;border-radius:16px;display:block}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    @media(max-width:900px){.grid{grid-template-columns:1fr}}
    ul{margin:0;padding-left:18px}
    .muted{color:#475569}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="badge">Siivouspalvelut · {{city}}</div>
      <div class="muted">{{phone}} · {{email}}</div>
    </div>

    <div class="hero">
      <div class="card">
        <h1 style="margin:0 0 10px;font-size:40px;line-height:1.1">{{business_name}}</h1>
        <div class="muted">{{industry}}</div>
        <div style="height:10px"></div>
        <div style="font-weight:800;margin-bottom:6px">Palvelut</div>
        {{services_html}}
        <div style="height:14px"></div>
        <a class="btn" href="mailto:{{email}}">Pyydä tarjous</a>
        <div class="muted" style="margin-top:10px">{{address}}</div>
      </div>

      <div>
        <img src="{{hero_image_url}}" alt="" />
      </div>
    </div>

    <div style="height:16px"></div>
    <div class="grid">
      {{gallery_html}}
    </div>
  </div>
</body>
</html>
