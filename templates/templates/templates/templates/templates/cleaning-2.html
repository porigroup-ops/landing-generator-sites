<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{business_name}}</title>
  <style>
    body{margin:0;font-family:system-ui,Segoe UI,Roboto;background:linear-gradient(180deg,#0b1220, #111827);color:#e5e7eb}
    .wrap{max-width:1100px;margin:0 auto;padding:28px}
    .hero{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;align-items:center}
    @media(max-width:900px){.hero{grid-template-columns:1fr}}
    .card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);border-radius:18px;padding:18px}
    .btn{display:inline-block;background:#fbbf24;color:#111827;padding:12px 16px;border-radius:14px;text-decoration:none;font-weight:900}
    img{width:100%;border-radius:16px;display:block}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    @media(max-width:900px){.grid{grid-template-columns:1fr}}
    ul{margin:0;padding-left:18px}
    .muted{color:#9ca3af}
    .title{font-size:44px;line-height:1.05;margin:0 0 10px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div>
        <div class="muted">{{industry}} · {{city}}</div>
        <h1 class="title">{{business_name}}</h1>

        <div class="card">
          <div style="font-weight:900;margin-bottom:6px">Palvelut</div>
          {{services_html}}
        </div>

        <div style="height:14px"></div>
        <a class="btn" href="mailto:{{email}}">Pyydä tarjous</a>
        <div class="muted" style="margin-top:10px">{{phone}} · {{email}} · {{address}}</div>
      </div>

      <div>
        <img src="{{hero_image_url}}" alt="" />
      </div>
    </div>

    <div style="height:16px"></div>
    <div class="grid">
      {{gallery_html}}
    </div>
  </div>
</body>
</html>
